name: Cloud

on:
  push:
    branches: [main]
    paths: ['apps/cloud/**', '.github/workflows/cloud.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: cloud-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ${{ vars.HOSTED_RUNNERS == 'true' && 'ubuntu-latest' || 'tessera-vm' }}
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CLOUD_ENV: ${{ inputs.environment == 'staging' && 'staging' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/bun

      - name: Apply migrations
        working-directory: apps/cloud
        run: npx wrangler d1 migrations apply DB --remote ${CLOUD_ENV:+--env "$CLOUD_ENV"}

      - name: Deploy
        working-directory: apps/cloud
        env:
          UPDATES_URL: ${{ vars.UPDATES_URL }}
        run: |
          platforms=$(node ../../scripts/channel.ts published)
          echo "published: $platforms"
          npx wrangler deploy ${CLOUD_ENV:+--env "$CLOUD_ENV"} --var "UPDATES_URL:$UPDATES_URL" --var "PLATFORMS:$platforms"
