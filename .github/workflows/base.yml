name: Base

on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: base-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fresh:
    name: Fresh base
    if: github.event.label.name == 'stack' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/fresh-base
        with:
          pull-request: ${{ github.event.pull_request.number }}
          head: ${{ github.event.pull_request.head.sha }}
          token: ${{ github.token }}
