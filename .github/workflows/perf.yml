name: Timing tests

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    name: Timing tests
    runs-on: ${{ vars.HOSTED_RUNNERS == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted", "boat"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/bun

      - name: bun run check --only perf
        run: bun run check --only perf
