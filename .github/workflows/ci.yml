name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CI: 'true'
  E2E_TELEMETRY_DISABLED: '1'
  # The typed lint of the whole repository peaks near 4 GB, past Node's default heap on the runner.
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  check:
    name: Check
    runs-on: ${{ (vars.HOSTED_RUNNERS == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'boat-large' }}
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/changed
        id: changed

      - uses: ./.github/actions/bun
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}

      - name: bun run check --job ts --skip vitest,perf
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bun run check --job ts --skip vitest,perf

      - name: bun run check --only vitest
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bun run check --only vitest

      - uses: ./.github/actions/tauri-linux
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.changed.outputs.rust != 'false' }}

      - uses: ./.github/actions/rust
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.changed.outputs.rust != 'false' }}
        with:
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: bun run check --only rust-lint
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.changed.outputs.rust != 'false' }}
        run: bun run check --only rust-lint

      - name: bun run check --only bindings
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.changed.outputs.rust != 'false' }}
        run: bun run check --only bindings

      - uses: ./.github/actions/nextest
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.changed.outputs.rust != 'false' }}

      - name: bun run check --only cargo-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.changed.outputs.rust != 'false' }}
        run: bun run check --only cargo-test

      - name: bun run check --only shell
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.changed.outputs.desktop != 'false' && steps.changed.outputs.rust != 'false' }}
        run: bun run check --only shell

      - name: bun run check --only smoke
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.changed.outputs.desktop != 'false' && steps.changed.outputs.rust != 'false' }}
        run: bun run check --only smoke

      - uses: ./.github/actions/fresh-base
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          pull-request: ${{ github.event.pull_request.number }}
          head: ${{ github.event.pull_request.head.sha }}
          token: ${{ github.token }}

  windows:
    name: Check (Windows)
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.HOSTED_RUNNERS == 'true' && 'windows-latest' || 'tessera-win' }}
    timeout-minutes: 120
    concurrency:
      group: ci-windows-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Git Bash on PATH
        shell: powershell
        run: Join-Path (Split-Path (Split-Path (Get-Command git).Source)) 'bin' | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust

      - uses: ./.github/actions/nextest

      - name: cargo clippy (Windows)
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: cargo nextest (Windows)
        run: cargo nextest run --workspace --locked
