name: Tauri on Linux
description: Installs the Tauri system libraries (docs/dev.md §1)

runs:
  using: composite
  steps:
    - name: Tauri system libraries
      shell: bash
      run: |
        pkgs=(
          libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev
          libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libssl-dev pkg-config patchelf
        )
        missing=()
        for p in "${pkgs[@]}"; do
          dpkg -s "$p" >/dev/null 2>&1 || missing+=("$p")
        done
        if [ ${#missing[@]} -eq 0 ]; then
          echo "Tauri system libraries already installed"
          exit 0
        fi
        if ! sudo -n true 2>/dev/null; then
          echo "::error::Missing Tauri packages (${missing[*]}) and passwordless sudo is unavailable on this runner. Install them on the host, then re-run."
          exit 1
        fi
        sudo sed -i 's#http://[a-z.]*archive.ubuntu.com#http://fr.archive.ubuntu.com#g' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends "${missing[@]}"
