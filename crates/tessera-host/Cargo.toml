[package]
name = "tessera-host"
description = "Tessera module contract: the event bus, topic handlers, runtime modules and per-crate TypeScript exports that domain crates implement to plug into the runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tessera-core.workspace = true
tessera-protocol.workspace = true
tessera-tools.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
tracing.workspace = true
ts-rs = { workspace = true, features = ["serde-json-impl", "chrono-impl"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
