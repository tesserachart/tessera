[package]
name = "tessera-market"
description = "Tessera market data: MarketDataProvider trait, the market router, the market module (tools and topics) and bar aggregation; with `test-support`, the deterministic mock provider for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tessera-core.workspace = true
tessera-host.workspace = true
tessera-protocol.workspace = true
tessera-store.workspace = true
tessera-tools.workspace = true
async-trait.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
futures.workspace = true
parking_lot.workspace = true
rust_decimal.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-stream = { workspace = true, features = ["time"] }
tracing.workspace = true
ts-rs = { workspace = true, features = ["serde-json-impl", "chrono-impl"] }

[features]
test-support = ["tessera-core/test-support"]

[dev-dependencies]
tessera-core = { workspace = true, features = ["test-support"] }
tessera-market = { path = ".", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

[[example]]
name = "mock_summary"
required-features = ["test-support"]

[[example]]
name = "flow_load"
required-features = ["test-support"]

[lints]
workspace = true
