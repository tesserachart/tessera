[package]
name = "tessera-journal"
description = "Tessera journal: TheTraderLog brought in. Trades built from every connection's fills and imported exports, what the trader adds to them, and their measured statistics, served as the journal.* tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tessera-core.workspace = true
tessera-host.workspace = true
tessera-market.workspace = true
tessera-broker.workspace = true
tessera-protocol.workspace = true
tessera-store.workspace = true
tessera-tools.workspace = true
async-trait.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
futures.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
rust_decimal.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true
ts-rs = { workspace = true, features = ["serde-json-impl", "chrono-impl", "no-serde-warnings"] }

[dev-dependencies]
tessera-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
