[package]
name = "tessera-testkit"
description = "Test support for the Tessera runtime: fake connections (the mock market, mock levels, a read-only prop firm login, a fake Rithmic and fake level vendors) as a runtime module, and the tessera-test-runtime binary serving them for the agent e2e suite. Tests and that binary only: the runtime binary never links it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tessera-test-runtime"
path = "src/bin/tessera-test-runtime.rs"

[dependencies]
async-trait.workspace = true
futures.workspace = true
rust_decimal.workspace = true
serde_json.workspace = true
tessera-broker.workspace = true
tessera-core = { workspace = true, features = ["test-support"] }
tessera-host.workspace = true
tessera-intel = { workspace = true, features = ["test-support"] }
tessera-market = { workspace = true, features = ["test-support"] }
tessera-protocol.workspace = true
tessera-rithmic.workspace = true
tessera-runtime = { path = "../tessera-runtime" }
tessera-store.workspace = true
tessera-tools.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
