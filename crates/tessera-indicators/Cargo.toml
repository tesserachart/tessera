[package]
name = "tessera-indicators"
description = "Tessera indicators: the catalog of built-in and custom indicators, custom indicators' JavaScript and versions, and their values from the script engine (indicators.* tools and topics)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tessera-core.workspace = true
tessera-host.workspace = true
tessera-market.workspace = true
tessera-protocol.workspace = true
tessera-script.workspace = true
tessera-store.workspace = true
tessera-tools.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
parking_lot.workspace = true
rust_decimal.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true
ts-rs = { workspace = true, features = ["serde-json-impl"] }

[dev-dependencies]
tessera-core = { workspace = true, features = ["test-support"] }
tessera-market = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
