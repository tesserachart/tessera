[package]
name = "tessera-alerts"
description = "Tessera alerts: price, level, indicator, drawing and sequence alerts the runtime keeps and evaluates on the live feed, their history and their deliveries (alerts.* tools and topic)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tessera-core.workspace = true
tessera-host.workspace = true
tessera-market.workspace = true
tessera-protocol.workspace = true
tessera-store.workspace = true
tessera-tools.workspace = true
tessera-http.workspace = true
async-trait.workspace = true
chrono-tz.workspace = true
parking_lot.workspace = true
rust_decimal.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true
ts-rs = { workspace = true, features = ["serde-json-impl"] }

[dev-dependencies]
tessera-market = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
